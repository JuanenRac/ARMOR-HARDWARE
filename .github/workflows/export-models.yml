# The STL and 3MF of each piece are made from the OpenSCAD sources and kept as an artifact of the run, not committed: a model file can then never disagree with its source.
name: Export the enclosure models

on:
  push:
    paths:
      - "scad/**"
      - "tools/export_models.py"
      - ".github/workflows/export-models.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Render every piece
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install --yes openscad

      - name: Export the pieces
        run: python tools/export_models.py --out build/models

      - name: Keep the model files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enclosure-models
          path: build/models/
          if-no-files-found: error
          retention-days: 30
